name: Owned CPU correctness gate
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/release-v0.4.3']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 354fab82dbd91d2526a41ee4dbfff1012a623798
          path: build/vulkan-headers
      - uses: actions/checkout@v4
        with:
          repository: iWirk/OptiScaler-VK
          ref: 9ce9340beeef3d016dcdb9c563d87bb7f94bf21b
          path: build/opti-reader
      - name: CPU tests (no GPU or deployment)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd g++-mingw-w64-x86-64
          python3 tools/test-codebase.py --vulkan-include "$PWD/build/vulkan-headers/include" --opti-reader "$PWD/build/opti-reader/OptiScaler/upscalers/ffx" --mingw-cxx x86_64-w64-mingw32-g++ --output "$PWD/build/ci-evidence"
      - name: Release ZIP policy and embedding checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/test-package-release.py -v
          python3 -O tools/test-package-release.py -v
          python3 tools/test-embed-fsr411-assets.py -v
          python3 -O tools/fsr411-assets.py assets/fsr411
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence
          path: build/ci-evidence
          if-no-files-found: error
